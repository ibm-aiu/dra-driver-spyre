---
# spyre-pf: PF (productId 06a7) devices without card management.
# Generally available for users.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: spyre-pf
spec:
  selectors:
  - cel:
      expression: >
        device.driver == 'spyre.ibm.com' &&
        device.attributes["spyre.ibm.com"].productId == "06a7" &&
        (!has(device.attributes["spyre.ibm.com"].managed) ||
          device.attributes["spyre.ibm.com"].managed == false)
---
# spyre-vf: VF (productId 06a8) devices without card management.
# Generally available for users.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: spyre-vf
spec:
  selectors:
  - cel:
      expression: >
        device.driver == 'spyre.ibm.com' &&
        device.attributes["spyre.ibm.com"].productId == "06a8" &&
        (!has(device.attributes["spyre.ibm.com"].managed) ||
          device.attributes["spyre.ibm.com"].managed == false)
---
# spyre-managed-pf: PF (productId 06a7) devices with card management enabled.
# Restricted to privileged namespaces (e.g. spyre-operator).
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: spyre-managed-pf
spec:
  selectors:
  - cel:
      expression: >
        device.driver == 'spyre.ibm.com' &&
        device.attributes["spyre.ibm.com"].productId == "06a7" &&
        has(device.attributes["spyre.ibm.com"].managed) &&
        device.attributes["spyre.ibm.com"].managed == true
---
# spyre-managed-vf: VF (productId 06a8) devices with card management enabled.
# Restricted to privileged namespaces (e.g. spyre-operator).
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: spyre-managed-vf
spec:
  selectors:
  - cel:
      expression: >
        device.driver == 'spyre.ibm.com' &&
        device.attributes["spyre.ibm.com"].productId == "06a8" &&
        has(device.attributes["spyre.ibm.com"].managed) &&
        device.attributes["spyre.ibm.com"].managed == true
